<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignX Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-shell">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <svg class="brand-icon" width="20" height="20" viewBox="0 0 128 128" fill="none">
          <rect width="128" height="128" rx="28" fill="url(#pop-grad)"/>
          <path d="M40 36L88 92M88 36L40 92" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
          <circle cx="64" cy="64" r="8" fill="#10b981"/>
          <defs>
            <linearGradient id="pop-grad" x1="0" y1="0" x2="128" y2="128">
              <stop stop-color="#06b6d4"/>
              <stop offset="1" stop-color="#6366f1"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="brand-text">
          <h2>SignX</h2>
          <span>ISL Assistant</span>
        </div>
      </div>
      <span class="status-indicator-dot" title="Ready"></span>
    </header>

    <!-- Quick Action Launchers -->
    <div class="popup-body">
      <button id="open-sidepanel-action" class="action-btn primary-action">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
        <div class="action-info">
          <strong>Open SignX Side Panel</strong>
          <small>Full ISL Avatar & Webcam Sign-to-Text</small>
        </div>
      </button>

      <button id="toggle-floating-overlay-action" class="action-btn secondary-action">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        <div class="action-info">
          <strong>Floating Avatar Overlay</strong>
          <small>Show on current webpage / YouTube</small>
        </div>
      </button>
    </div>

    <!-- Footer Shortcuts -->
    <footer class="popup-footer">
      <span>Shortcut: <kbd>Ctrl+Shift+X</kbd> to open side panel</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
